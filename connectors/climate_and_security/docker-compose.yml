# The Center for Climate & Security OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  climate-and-security:
    build: .
    container_name: opencti-connector-climate-and-security
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=The Center for Climate & Security
      - CONNECTOR_SCOPE=climate_and_security
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - CLIMATE_AND_SECURITY_FEED_URL=https://councilonstrategicrisks.org/feed/
      - CLIMATE_AND_SECURITY_POLL_INTERVAL=3600
      - CLIMATE_AND_SECURITY_REQUEST_DELAY=15
      - CLIMATE_AND_SECURITY_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - CLIMATE_AND_SECURITY_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - CLIMATE_AND_SECURITY_RENDER_RETRIES=3
      - CLIMATE_AND_SECURITY_PDF_RENDER_TIMEOUT=120
      - CLIMATE_AND_SECURITY_CONFIDENCE=50
      - CLIMATE_AND_SECURITY_REPORT_TYPE=open-source-reporting
      - CLIMATE_AND_SECURITY_TLP=TLP:CLEAR
      - CLIMATE_AND_SECURITY_AUTHOR_NAME=The Center for Climate and Security
    restart: always
