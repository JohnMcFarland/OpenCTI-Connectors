# ASPI The Strategist OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  aspi-strategist:
    build: .
    container_name: opencti-connector-aspi-strategist
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=ASPI The Strategist
      - CONNECTOR_SCOPE=aspi_strategist
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - ASPI_STRATEGIST_FEED_URL=https://www.aspistrategist.org.au/feed/
      - ASPI_STRATEGIST_POLL_INTERVAL=1800
      - ASPI_STRATEGIST_REQUEST_DELAY=2
      - ASPI_STRATEGIST_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - ASPI_STRATEGIST_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - ASPI_STRATEGIST_RENDER_RETRIES=3
      - ASPI_STRATEGIST_PDF_RENDER_TIMEOUT=120
      - ASPI_STRATEGIST_CONFIDENCE=50
      - ASPI_STRATEGIST_REPORT_TYPE=open-source-reporting
      - ASPI_STRATEGIST_TLP=TLP:CLEAR
      - ASPI_STRATEGIST_AUTHOR_NAME=Australian Strategic Policy Institute
    restart: always
