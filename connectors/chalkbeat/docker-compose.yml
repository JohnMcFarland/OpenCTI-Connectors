# Chalkbeat OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  chalkbeat:
    build: .
    container_name: opencti-connector-chalkbeat
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Chalkbeat
      - CONNECTOR_SCOPE=chalkbeat
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - CHALKBEAT_BASE_URL=https://www.chalkbeat.org
      - CHALKBEAT_QUERYLY_KEY=12a8b884283a4e73
      - CHALKBEAT_POLL_INTERVAL=86400   # seconds between enumeration runs (24h)
      - CHALKBEAT_REQUEST_DELAY=2       # seconds between article fetches
      - CHALKBEAT_MAX_REPORTS=0          # 0 = unlimited; set to 3 for a bounded test run
      - CHALKBEAT_RENDER_RETRIES=3
      - CHALKBEAT_CONFIDENCE=50          # OpenCTI confidence 0-100 (Medium band)
      - CHALKBEAT_REPORT_TYPE=open-source-reporting
      - CHALKBEAT_TLP=TLP:CLEAR
      - CHALKBEAT_AUTHOR_NAME=Chalkbeat
    restart: always
