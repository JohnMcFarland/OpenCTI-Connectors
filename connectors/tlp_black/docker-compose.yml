version: '3'
services:
  tlp-black:
    build: .
    container_name: opencti-connector-tlp-black
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=TLPBLACK
      - CONNECTOR_SCOPE=tlp_black
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service ---
      - RENDER_SERVICE_URL=http://pdf-renderer:8080/render
      - RENDER_TIMEOUT=120
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - TLP_BLACK_BASE_URL=https://tlpblack.net
      - TLP_BLACK_POLL_INTERVAL=86400        # seconds between enumeration runs (24h)
      - TLP_BLACK_REQUEST_DELAY=3            # seconds between successive fetches
      - TLP_BLACK_MAX_REPORTS=0              # 0 = unlimited; set to 3 for a bounded test run
      - TLP_BLACK_RENDER_RETRIES=3
      - TLP_BLACK_CONFIDENCE=50              # OpenCTI confidence 0-100 (Medium band)
      - TLP_BLACK_REPORT_TYPE=open-source-reporting
      - TLP_BLACK_TLP=TLP:CLEAR
      - TLP_BLACK_AUTHOR_NAME=TLPBLACK
    restart: always
