# Structure-documenting defaults only. Real platform credentials and instance
# values are supplied by docker-compose.override.yml (env vars), which is never
# committed. Environment variables take precedence over anything set here.
opencti:
  url: ''
  token: ''
connector:
  id: ''
  type: 'EXTERNAL_IMPORT'
  name: 'The Diplomat'
  scope: 'the_diplomat'
  log_level: 'info'
the_diplomat:
  base_url: 'https://thediplomat.com'
  poll_interval: 86400        # seconds between enumeration runs (24h)
  request_delay: 3            # seconds between Playwright navigations (courteous)
  max_reports: 0              # 0 = unlimited; set to 3 for a bounded test
  render_retries: 3
  pdf_render_timeout: 120       # seconds; wall-clock limit on a single PDF render
  playwright_nav_timeout: 60000  # ms; Cloudflare challenge may need time
  confidence: 50
  report_type: 'open-source-reporting'
  tlp: 'TLP:CLEAR'
  author_name: 'The Diplomat'
