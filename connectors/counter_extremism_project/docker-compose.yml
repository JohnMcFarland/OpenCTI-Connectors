# Counter Extremism Project OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  counter-extremism-project:
    build: .
    container_name: opencti-connector-counter-extremism-project
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Counter Extremism Project
      - CONNECTOR_SCOPE=counter_extremism_project
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - COUNTER_EXTREMISM_PROJECT_FEED_URL=https://www.counterextremism.com/rss.xml
      - COUNTER_EXTREMISM_PROJECT_POLL_INTERVAL=3600
      - COUNTER_EXTREMISM_PROJECT_REQUEST_DELAY=30
      - COUNTER_EXTREMISM_PROJECT_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - COUNTER_EXTREMISM_PROJECT_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - COUNTER_EXTREMISM_PROJECT_RENDER_RETRIES=3
      - COUNTER_EXTREMISM_PROJECT_PDF_RENDER_TIMEOUT=120
      - COUNTER_EXTREMISM_PROJECT_CONFIDENCE=50
      - COUNTER_EXTREMISM_PROJECT_REPORT_TYPE=open-source-reporting
      - COUNTER_EXTREMISM_PROJECT_TLP=TLP:CLEAR
      - COUNTER_EXTREMISM_PROJECT_AUTHOR_NAME=Counter Extremism Project
    restart: always
