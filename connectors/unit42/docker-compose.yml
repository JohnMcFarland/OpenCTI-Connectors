# Unit 42 OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  unit42:
    build: .
    container_name: opencti-connector-unit42
    environment:
      # --- OpenCTI platform connection ---
      # OPENCTI_URL is the canonical platform pointer (pycti opencti.url).
      # Value (e.g. http://opencti:8080) lives in the override.
      - OPENCTI_URL=
      # Connector service-account token. Local override key: UNIT42_OPENCTI_TOKEN
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Unit 42
      - CONNECTOR_SCOPE=unit42
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - UNIT42_BASE_URL=https://unit42.paloaltonetworks.com
      - UNIT42_CATEGORY=threat-research         # WordPress category slug to ingest
      - UNIT42_POLL_INTERVAL=86400              # seconds between enumeration runs (24h)
      - UNIT42_REQUEST_DELAY=3                  # seconds between renders / page fetches
      - UNIT42_MAX_REPORTS=0                    # 0 = unlimited; set to 3 for a bounded test run
      - UNIT42_MAX_PAGES=500                    # safety bound on feed pages per run (real count ~61)
      - PLAYWRIGHT_NAV_TIMEOUT=60000            # ms; page navigation timeout
      - UNIT42_RENDER_RETRIES=3
      - UNIT42_CONFIDENCE=50                    # OpenCTI confidence 0-100 (Medium band)
      - UNIT42_REPORT_TYPE=open-source-reporting
      - UNIT42_TLP=TLP:CLEAR
      - UNIT42_AUTHOR_NAME=Unit 42
    restart: always
    # Caps Chromium memory to protect Elasticsearch co-located on the OpenCTI
    # host. Tune to verified RAM headroom on the target VM.
    mem_limit: 2g
