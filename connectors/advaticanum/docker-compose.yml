# AdVaticanum OpenCTI connector — GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  advaticanum:
    build: .
    container_name: opencti-connector-advaticanum
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=AdVaticanum
      - CONNECTOR_SCOPE=advaticanum
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - ADVATICANUM_BASE_URL=https://advaticanum.com
      - ADVATICANUM_POLL_INTERVAL=21600     # seconds between full enumeration runs (6h)
      - ADVATICANUM_REQUEST_DELAY=3         # seconds between successive renders
      - ADVATICANUM_MAX_REPORTS=0           # 0 = unlimited; set to 3 for a bounded test run
      - ADVATICANUM_PLAYWRIGHT_NAV_TIMEOUT=60000
      - ADVATICANUM_RENDER_RETRIES=3
      - ADVATICANUM_CONFIDENCE=50           # OpenCTI confidence 0-100 (Medium band)
      - ADVATICANUM_REPORT_TYPE=open-source-reporting
      - ADVATICANUM_TLP=TLP:CLEAR
      - ADVATICANUM_AUTHOR_NAME=AdVaticanum
    restart: always
    mem_limit: 2g
