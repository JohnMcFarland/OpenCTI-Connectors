# Europol Newsroom OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  europol-newsroom:
    build: .
    container_name: opencti-connector-europol-newsroom
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Europol Newsroom
      - CONNECTOR_SCOPE=europol_newsroom
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - EUROPOL_NEWSROOM_FEED_URL=https://www.europol.europa.eu/rss.xml
      - EUROPOL_NEWSROOM_POLL_INTERVAL=3600
      - EUROPOL_NEWSROOM_REQUEST_DELAY=2
      - EUROPOL_NEWSROOM_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - EUROPOL_NEWSROOM_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - EUROPOL_NEWSROOM_RENDER_RETRIES=3
      - EUROPOL_NEWSROOM_PDF_RENDER_TIMEOUT=120
      - EUROPOL_NEWSROOM_CONFIDENCE=50
      - EUROPOL_NEWSROOM_REPORT_TYPE=open-source-reporting
      - EUROPOL_NEWSROOM_TLP=TLP:CLEAR
      - EUROPOL_NEWSROOM_AUTHOR_NAME=Europol
    restart: always
