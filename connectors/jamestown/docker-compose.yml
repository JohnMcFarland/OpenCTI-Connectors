# The Jamestown Foundation OpenCTI connector — GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  jamestown:
    build: .
    container_name: opencti-connector-jamestown
    environment:
      # --- OpenCTI platform connection ---
      # OPENCTI_URL is the canonical platform pointer (pycti opencti.url).
      # Value (e.g. http://opencti:8080) lives in the override.
      - OPENCTI_URL=
      # Connector service-account token. Local override key: JAMESTOWN_OPENCTI_TOKEN
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=The Jamestown Foundation
      - CONNECTOR_SCOPE=jamestown
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - JAMESTOWN_BASE_URL=https://jamestown.org
      - JAMESTOWN_POST_TYPES=posts,brief,report,interview,book  # which WP post types to ingest
      - JAMESTOWN_PUBLICATIONS=                 # empty = all series; else comma slugs e.g. tm,mlm,cb
      - JAMESTOWN_POLL_INTERVAL=86400           # seconds between full enumeration runs (24h)
      - JAMESTOWN_REQUEST_DELAY=2               # seconds between successive renders / API pages
      - JAMESTOWN_MAX_REPORTS=0                 # 0 = unlimited; set to 3 for a bounded test run
      - PLAYWRIGHT_NAV_TIMEOUT=60000            # ms; page navigation timeout
      - JAMESTOWN_RENDER_RETRIES=3
      - JAMESTOWN_CONFIDENCE=50                 # OpenCTI confidence 0-100 (Medium band)
      - JAMESTOWN_REPORT_TYPE=open-source-reporting
      - JAMESTOWN_TLP=TLP:CLEAR
      - JAMESTOWN_AUTHOR_NAME=The Jamestown Foundation
    restart: always
    # Caps Chromium memory to protect Elasticsearch co-located on the OpenCTI
    # host. Tune to verified RAM headroom on the target VM.
    mem_limit: 2g
