# Proofpoint Threat Insight OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  proofpoint-threat-insight:
    build: .
    container_name: opencti-connector-proofpoint-threat-insight
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Proofpoint Threat Insight
      - CONNECTOR_SCOPE=proofpoint_threat_insight
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - PROOFPOINT_THREAT_INSIGHT_FEED_URL=https://www.proofpoint.com/us/threat-insight-blog.xml
      - PROOFPOINT_THREAT_INSIGHT_POLL_INTERVAL=3600
      - PROOFPOINT_THREAT_INSIGHT_REQUEST_DELAY=10
      - PROOFPOINT_THREAT_INSIGHT_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - PROOFPOINT_THREAT_INSIGHT_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - PROOFPOINT_THREAT_INSIGHT_RENDER_RETRIES=3
      - PROOFPOINT_THREAT_INSIGHT_PDF_RENDER_TIMEOUT=120
      - PROOFPOINT_THREAT_INSIGHT_CONFIDENCE=50
      - PROOFPOINT_THREAT_INSIGHT_REPORT_TYPE=open-source-reporting
      - PROOFPOINT_THREAT_INSIGHT_TLP=TLP:CLEAR
      - PROOFPOINT_THREAT_INSIGHT_AUTHOR_NAME=Proofpoint Threat Insight
    restart: always
