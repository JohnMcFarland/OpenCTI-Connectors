# Chatham House OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  chatham-house:
    build: .
    container_name: opencti-connector-chatham-house
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Chatham House
      - CONNECTOR_SCOPE=chatham_house
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - CHATHAM_HOUSE_FEED_URL=https://www.chathamhouse.org/path/whatsnew.xml,https://www.chathamhouse.org/path/95/feed.xml
      - CHATHAM_HOUSE_POLL_INTERVAL=1800
      - CHATHAM_HOUSE_REQUEST_DELAY=10
      - CHATHAM_HOUSE_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - CHATHAM_HOUSE_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - CHATHAM_HOUSE_RENDER_RETRIES=3
      - CHATHAM_HOUSE_PDF_RENDER_TIMEOUT=120
      - CHATHAM_HOUSE_CONFIDENCE=50
      - CHATHAM_HOUSE_REPORT_TYPE=open-source-reporting
      - CHATHAM_HOUSE_TLP=TLP:CLEAR
      - CHATHAM_HOUSE_AUTHOR_NAME=Chatham House
    restart: always
