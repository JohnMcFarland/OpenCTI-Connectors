# Brookings Institution OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  brookings-institution:
    build: .
    container_name: opencti-connector-brookings-institution
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Brookings Institution
      - CONNECTOR_SCOPE=brookings_institution
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - BROOKINGS_INSTITUTION_BASE_URL=https://www.brookings.edu
      - BROOKINGS_INSTITUTION_PER_PAGE=100
      - BROOKINGS_INSTITUTION_POLL_INTERVAL=86400   # seconds between enumeration runs (24h)
      - BROOKINGS_INSTITUTION_REQUEST_DELAY=2       # seconds between article fetches
      - BROOKINGS_INSTITUTION_MAX_REPORTS=0          # 0 = unlimited; set to 3 for a bounded test run
      - BROOKINGS_INSTITUTION_RENDER_RETRIES=3
      - BROOKINGS_INSTITUTION_CONFIDENCE=50          # OpenCTI confidence 0-100 (Medium band)
      - BROOKINGS_INSTITUTION_REPORT_TYPE=open-source-reporting
      - BROOKINGS_INSTITUTION_TLP=TLP:CLEAR
      - BROOKINGS_INSTITUTION_AUTHOR_NAME=Brookings Institution
    restart: always
