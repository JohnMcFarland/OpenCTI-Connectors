# Structure-documenting defaults only. Real platform credentials and instance
# values are supplied by docker-compose.override.yml (env vars), which is never
# committed. Environment variables take precedence over anything set here.
opencti:
  url: ''
  token: ''
connector:
  id: ''
  type: 'EXTERNAL_IMPORT'
  name: 'Migration Policy Institute'
  scope: 'migration_policy_institute'
  log_level: 'info'
migration_policy_institute:
  base_url: 'https://www.migrationpolicy.org'
  listing_urls: '/research,/news'     # comma-separated listing page paths
  poll_interval: 21600                # seconds between enumeration runs (6h)
  request_delay: 3                    # seconds between page loads (WAF-friendly)
  max_reports: 0                      # 0 = unlimited; set to 3 for a bounded test
  playwright_nav_timeout: 60000       # ms
  render_retries: 3
  confidence: 50
  report_type: 'open-source-reporting'
  tlp: 'TLP:CLEAR'
  author_name: 'Migration Policy Institute'
