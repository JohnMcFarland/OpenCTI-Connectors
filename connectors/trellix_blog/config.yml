# Structure-documenting defaults only. Real platform credentials and instance
# values are supplied by docker-compose.override.yml (env vars), which is never
# committed. Environment variables take precedence over anything set here.
opencti:
  url: ''
  token: ''
connector:
  id: ''
  type: 'EXTERNAL_IMPORT'
  name: 'Trellix Blog'
  scope: 'trellix_blog'
  log_level: 'info'
trellix_blog:
  base_url: 'https://www.trellix.com'
  # Sole enumeration surface: the complete en-US sitemap declared in robots.txt.
  # The origin publishes no RSS feed. Empty = derived from base_url.
  sitemap_url: ''
  # Comma-separated blog category slugs. Default = the two threat-intelligence
  # categories (453 posts). Add 'perspectives' (138) for corporate and
  # thought-leadership content.
  categories: 'research,platform'
  poll_interval: 86400        # seconds between enumeration runs (24h)
  request_delay: 3            # seconds between article page loads
  max_reports: 0              # 0 = unlimited; set to 3 for a bounded test
  playwright_nav_timeout: 60000
  render_retries: 3
  confidence: 50
  report_type: 'open-source-reporting'
  tlp: 'TLP:CLEAR'
  author_name: 'Trellix'
