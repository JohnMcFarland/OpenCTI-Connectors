# IISS (International Institute for Strategic Studies) OpenCTI connector -
# GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  iiss:
    build: .
    container_name: opencti-connector-iiss
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=International Institute for Strategic Studies
      - CONNECTOR_SCOPE=iiss
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - IISS_BASE_URL=https://www.iiss.org
      - IISS_POLL_INTERVAL=86400          # seconds between enumeration runs (24h)
      - IISS_REQUEST_DELAY=3              # seconds between page loads
      - IISS_MAX_REPORTS=0                # 0 = unlimited; set to 3 for a bounded test run
      - IISS_PLAYWRIGHT_NAV_TIMEOUT=60000 # ms
      - IISS_RENDER_RETRIES=3
      - IISS_CONFIDENCE=50                # OpenCTI confidence 0-100 (Medium band)
      - IISS_REPORT_TYPE=open-source-reporting
      - IISS_TLP=TLP:CLEAR
      - IISS_AUTHOR_NAME=International Institute for Strategic Studies
    restart: always
