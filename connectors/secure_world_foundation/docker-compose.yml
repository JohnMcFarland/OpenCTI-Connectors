# Secure World Foundation OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  secure-world-foundation:
    build: .
    container_name: opencti-connector-secure-world-foundation
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Secure World Foundation
      - CONNECTOR_SCOPE=secure_world_foundation
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - SECURE_WORLD_FOUNDATION_FEED_URL=https://www.swfound.org/publications-and-reports/rss.xml
      - SECURE_WORLD_FOUNDATION_POLL_INTERVAL=3600
      - SECURE_WORLD_FOUNDATION_REQUEST_DELAY=3
      - SECURE_WORLD_FOUNDATION_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - SECURE_WORLD_FOUNDATION_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - SECURE_WORLD_FOUNDATION_RENDER_RETRIES=3
      - SECURE_WORLD_FOUNDATION_PDF_RENDER_TIMEOUT=120
      - SECURE_WORLD_FOUNDATION_CONFIDENCE=50
      - SECURE_WORLD_FOUNDATION_REPORT_TYPE=open-source-reporting
      - SECURE_WORLD_FOUNDATION_TLP=TLP:CLEAR
      - SECURE_WORLD_FOUNDATION_AUTHOR_NAME=Secure World Foundation
    restart: always
