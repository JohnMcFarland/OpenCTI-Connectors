version: '3'
services:
  ccdcoe:
    build: .
    container_name: opencti-connector-ccdcoe
    environment:
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      - CONNECTOR_ID=
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=CCDCOE
      - CONNECTOR_SCOPE=ccdcoe
      - CONNECTOR_LOG_LEVEL=info
      - CCDCOE_BASE_URL=https://ccdcoe.org
      - CCDCOE_POLL_INTERVAL=86400
      - CCDCOE_REQUEST_DELAY=3
      - CCDCOE_MAX_REPORTS=0
      - CCDCOE_RENDER_RETRIES=3
      - CCDCOE_CONFIDENCE=60
      - CCDCOE_REPORT_TYPE=open-source-reporting
      - CCDCOE_TLP=TLP:CLEAR
      - CCDCOE_AUTHOR_NAME=CCDCOE
    mem_limit: 2g
    restart: always
