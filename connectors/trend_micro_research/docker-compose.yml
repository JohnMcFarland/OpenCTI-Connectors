# Trend Micro Research OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  trend-micro-research:
    build: .
    container_name: opencti-connector-trend-micro-research
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Trend Micro Research
      - CONNECTOR_SCOPE=trend_micro_research
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - TREND_MICRO_RESEARCH_FEED_URL=https://feeds.feedburner.com/TrendMicroResearch
      - TREND_MICRO_RESEARCH_POLL_INTERVAL=3600
      - TREND_MICRO_RESEARCH_REQUEST_DELAY=3
      - TREND_MICRO_RESEARCH_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - TREND_MICRO_RESEARCH_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - TREND_MICRO_RESEARCH_RENDER_RETRIES=3
      - TREND_MICRO_RESEARCH_PDF_RENDER_TIMEOUT=120
      - TREND_MICRO_RESEARCH_CONFIDENCE=50
      - TREND_MICRO_RESEARCH_REPORT_TYPE=open-source-reporting
      - TREND_MICRO_RESEARCH_TLP=TLP:CLEAR
      - TREND_MICRO_RESEARCH_AUTHOR_NAME=Trend Micro Research
    restart: always
