# Recorded Future Insikt Group OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  recorded-future-insikt:
    build: .
    container_name: opencti-connector-recorded-future-insikt
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Recorded Future Insikt Group
      - CONNECTOR_SCOPE=recorded_future_insikt
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - RECORDED_FUTURE_INSIKT_FEED_URL=https://www.recordedfuture.com/feed
      - RECORDED_FUTURE_INSIKT_POLL_INTERVAL=3600
      - RECORDED_FUTURE_INSIKT_REQUEST_DELAY=3
      - RECORDED_FUTURE_INSIKT_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - RECORDED_FUTURE_INSIKT_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - RECORDED_FUTURE_INSIKT_RENDER_RETRIES=3
      - RECORDED_FUTURE_INSIKT_PDF_RENDER_TIMEOUT=120
      - RECORDED_FUTURE_INSIKT_CONFIDENCE=50
      - RECORDED_FUTURE_INSIKT_REPORT_TYPE=open-source-reporting
      - RECORDED_FUTURE_INSIKT_TLP=TLP:CLEAR
      - RECORDED_FUTURE_INSIKT_AUTHOR_NAME=Recorded Future
    restart: always
