# The Jerusalem Post OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  jerusalem-post:
    build: .
    container_name: opencti-connector-jerusalem-post
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=The Jerusalem Post
      - CONNECTOR_SCOPE=jerusalem_post
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - JERUSALEM_POST_FEED_URL=https://www.jpost.com/rss/rssfeeddefense-and-tech,https://www.jpost.com/rss/rssfeedsmiddleeastnews.aspx
      - JERUSALEM_POST_POLL_INTERVAL=1800
      - JERUSALEM_POST_REQUEST_DELAY=3
      - JERUSALEM_POST_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - JERUSALEM_POST_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - JERUSALEM_POST_RENDER_RETRIES=3
      - JERUSALEM_POST_PDF_RENDER_TIMEOUT=120
      - JERUSALEM_POST_CONFIDENCE=50
      - JERUSALEM_POST_REPORT_TYPE=open-source-reporting
      - JERUSALEM_POST_TLP=TLP:CLEAR
      - JERUSALEM_POST_AUTHOR_NAME=The Jerusalem Post
    restart: always
