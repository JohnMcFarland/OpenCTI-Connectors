# UK Health Security Agency OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  uk-health-security-agency:
    build: .
    container_name: opencti-connector-uk-health-security-agency
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=UK Health Security Agency
      - CONNECTOR_SCOPE=uk_health_security_agency
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - UK_HEALTH_SECURITY_AGENCY_FEED_URL=https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=uk-health-security-agency,https://www.gov.uk/search/research-and-statistics.atom?content_store_document_type=research&organisations%5B%5D=uk-health-security-agency
      - UK_HEALTH_SECURITY_AGENCY_POLL_INTERVAL=1800
      - UK_HEALTH_SECURITY_AGENCY_REQUEST_DELAY=2
      - UK_HEALTH_SECURITY_AGENCY_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - UK_HEALTH_SECURITY_AGENCY_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - UK_HEALTH_SECURITY_AGENCY_RENDER_RETRIES=3
      - UK_HEALTH_SECURITY_AGENCY_PDF_RENDER_TIMEOUT=120
      - UK_HEALTH_SECURITY_AGENCY_CONFIDENCE=50
      - UK_HEALTH_SECURITY_AGENCY_REPORT_TYPE=open-source-reporting
      - UK_HEALTH_SECURITY_AGENCY_TLP=TLP:CLEAR
      - UK_HEALTH_SECURITY_AGENCY_AUTHOR_NAME=UK Health Security Agency
    restart: always
