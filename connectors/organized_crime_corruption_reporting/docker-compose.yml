# OCCRP (Organized Crime and Corruption Reporting Project) OpenCTI connector -
# GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  organized_crime_corruption_reporting:
    build: .
    container_name: opencti-connector-organized-crime-corruption-reporting
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Organized Crime and Corruption Reporting Project
      - CONNECTOR_SCOPE=organized_crime_corruption_reporting
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_BASE_URL=https://www.occrp.org
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_POLL_INTERVAL=86400         # seconds between enumeration runs (24h)
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_REQUEST_DELAY=1             # seconds between requests; robots.txt Crawl-delay: 1
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_MAX_REPORTS=0               # 0 = unlimited; set to 3 for a bounded test run
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_RENDER_RETRIES=3
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_CONFIDENCE=50               # OpenCTI confidence 0-100 (Medium band)
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_REPORT_TYPE=open-source-reporting
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_TLP=TLP:CLEAR
      - ORGANIZED_CRIME_CORRUPTION_REPORTING_AUTHOR_NAME=Organized Crime and Corruption Reporting Project
    restart: always
