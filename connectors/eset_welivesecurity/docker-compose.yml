# ESET WeLiveSecurity OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  eset-welivesecurity:
    build: .
    container_name: opencti-connector-eset-welivesecurity
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=ESET WeLiveSecurity
      - CONNECTOR_SCOPE=eset_welivesecurity
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - ESET_WELIVESECURITY_FEED_URL=https://www.welivesecurity.com/en/rss/feed/
      - ESET_WELIVESECURITY_POLL_INTERVAL=3600
      - ESET_WELIVESECURITY_REQUEST_DELAY=2
      - ESET_WELIVESECURITY_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - ESET_WELIVESECURITY_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - ESET_WELIVESECURITY_RENDER_RETRIES=3
      - ESET_WELIVESECURITY_PDF_RENDER_TIMEOUT=120
      - ESET_WELIVESECURITY_CONFIDENCE=50
      - ESET_WELIVESECURITY_REPORT_TYPE=open-source-reporting
      - ESET_WELIVESECURITY_TLP=TLP:CLEAR
      - ESET_WELIVESECURITY_AUTHOR_NAME=WeLiveSecurity
    restart: always
