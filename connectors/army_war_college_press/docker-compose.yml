# US Army War College Press OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  army-war-college-press:
    build: .
    container_name: opencti-connector-army-war-college-press
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=US Army War College Press
      - CONNECTOR_SCOPE=army_war_college_press
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - ARMY_WAR_COLLEGE_PRESS_FEED_URL=https://press.armywarcollege.edu/recent.rss
      - ARMY_WAR_COLLEGE_PRESS_POLL_INTERVAL=3600
      - ARMY_WAR_COLLEGE_PRESS_REQUEST_DELAY=3
      - ARMY_WAR_COLLEGE_PRESS_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - ARMY_WAR_COLLEGE_PRESS_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - ARMY_WAR_COLLEGE_PRESS_RENDER_RETRIES=3
      - ARMY_WAR_COLLEGE_PRESS_PDF_RENDER_TIMEOUT=120
      - ARMY_WAR_COLLEGE_PRESS_CONFIDENCE=50
      - ARMY_WAR_COLLEGE_PRESS_REPORT_TYPE=open-source-reporting
      - ARMY_WAR_COLLEGE_PRESS_TLP=TLP:CLEAR
      - ARMY_WAR_COLLEGE_PRESS_AUTHOR_NAME=US Army War College Press
    restart: always
