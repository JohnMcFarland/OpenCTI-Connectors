# Security Affairs OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  security-affairs:
    build: .
    container_name: opencti-connector-security-affairs
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Security Affairs
      - CONNECTOR_SCOPE=security_affairs
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - SECURITY_AFFAIRS_FEED_URL=https://securityaffairs.com/feed/
      - SECURITY_AFFAIRS_POLL_INTERVAL=1800
      - SECURITY_AFFAIRS_REQUEST_DELAY=3
      - SECURITY_AFFAIRS_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - SECURITY_AFFAIRS_MAX_AGE_DAYS=0            # skip items older than this (0 = no limit)
      - SECURITY_AFFAIRS_RENDER_RETRIES=3
      - SECURITY_AFFAIRS_PDF_RENDER_TIMEOUT=120
      - SECURITY_AFFAIRS_CONFIDENCE=50
      - SECURITY_AFFAIRS_REPORT_TYPE=open-source-reporting
      - SECURITY_AFFAIRS_TLP=TLP:CLEAR
      - SECURITY_AFFAIRS_AUTHOR_NAME=Security Affairs
    restart: always
