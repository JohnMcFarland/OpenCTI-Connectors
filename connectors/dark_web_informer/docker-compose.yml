# Dark Web Informer OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  dark-web-informer:
    build: .
    container_name: opencti-connector-dark-web-informer
    volumes:
      # Shared Crucible classifier helper, read-only, at /microservices.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Dark Web Informer
      - CONNECTOR_SCOPE=dark_web_informer
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service ---
      - RENDER_SERVICE_URL=http://pdf-renderer:8080/render
      - RENDER_TIMEOUT=120
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - DARK_WEB_INFORMER_FEED_URL=https://darkwebinformer.com/feed/
      - DARK_WEB_INFORMER_POLL_INTERVAL=1800
      - DARK_WEB_INFORMER_REQUEST_DELAY=3
      - DARK_WEB_INFORMER_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - DARK_WEB_INFORMER_RENDER_RETRIES=3
      - DARK_WEB_INFORMER_CONFIDENCE=50
      - DARK_WEB_INFORMER_REPORT_TYPE=open-source-reporting
      - DARK_WEB_INFORMER_TLP=TLP:CLEAR
      - DARK_WEB_INFORMER_AUTHOR_NAME=Dark Web Informer
    restart: always
