# World Health Organization OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  world_health_organization:
    build: .
    container_name: opencti-connector-world-health-organization
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=World Health Organization
      - CONNECTOR_SCOPE=world_health_organization
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - WORLD_HEALTH_ORGANIZATION_BASE_URL=https://www.who.int
      - WORLD_HEALTH_ORGANIZATION_POLL_INTERVAL=86400   # seconds between enumeration runs (24h)
      - WORLD_HEALTH_ORGANIZATION_REQUEST_DELAY=2       # seconds between requests
      - WORLD_HEALTH_ORGANIZATION_MAX_REPORTS=0          # 0 = unlimited; set to 3 for a bounded test run
      - WORLD_HEALTH_ORGANIZATION_RENDER_RETRIES=3
      - WORLD_HEALTH_ORGANIZATION_CONFIDENCE=50          # OpenCTI confidence 0-100 (Medium band)
      - WORLD_HEALTH_ORGANIZATION_REPORT_TYPE=open-source-reporting
      - WORLD_HEALTH_ORGANIZATION_TLP=TLP:CLEAR
      - WORLD_HEALTH_ORGANIZATION_AUTHOR_NAME=World Health Organization
    restart: always
