# US News OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  usnews:
    build: .
    container_name: opencti-connector-usnews
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=US News
      - CONNECTOR_SCOPE=usnews
      - CONNECTOR_LOG_LEVEL=info
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      # Comma-separated feed keys: money, news, health, education, opinion, travel
      - USNEWS_FEEDS=money,health,education,opinion
      - USNEWS_POLL_INTERVAL=86400             # seconds between enumeration runs (24h)
      - USNEWS_REQUEST_DELAY=3                 # seconds between article page loads
      - USNEWS_MAX_REPORTS=0                   # 0 = unlimited; set to 3 for a bounded test run
      - PLAYWRIGHT_NAV_TIMEOUT=60000           # ms; page navigation timeout
      - USNEWS_RENDER_RETRIES=3
      - USNEWS_CONFIDENCE=50                   # OpenCTI confidence 0-100 (Medium band)
      - USNEWS_REPORT_TYPE=open-source-reporting
      - USNEWS_TLP=TLP:CLEAR
      - USNEWS_AUTHOR_NAME=US News
    restart: always
    # Caps Chromium memory to protect Elasticsearch co-located on the OpenCTI
    # host. Tune to verified RAM headroom on the target VM.
    mem_limit: 2g
