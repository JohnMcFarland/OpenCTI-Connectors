version: '3'
services:
  connector-openphish:
    image: connector-openphish
    environment:
      - OPENCTI_URL=ChangeMe
      - OPENCTI_TOKEN=ChangeMe
      - CONNECTOR_ID=ChangeMe
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=OpenPhish
      - CONNECTOR_SCOPE=identity,ipv4-addr,url,domainname,campaign,report,label,domain
      - CONNECTOR_UPDATE_EXISTING_DATA=true
      - CONNECTOR_LOG_LEVEL=info
      - OPENPHISH_INTERVAL_HOURS=3
      - OPENPHISH_FEED_NAME="premium/gov/feed.json"
      - OPENPHISH_ACCESS_KEY_ID=ChangeMe
      - OPENPHISH_ACCESS_KEY_SECRET=ChangeMe
      - OPENPHISH_OBSERVABLES_MARKING_DEFINITIONS=""
      - OPENPHISH_ORGANIZATIONS_MARKING_DEFINITIONS=""
      - OPENPHISH_RELATIONSHIPS_MARKING_DEFINITIONS=""
    restart: always