steps:
- name: 'gcr.io/cloud-builders/docker'
  id: Build
  args: [ 'build', '-t', '${_CONTAINER_IMAGE_NAME}' , '-f', 'openphish/Dockerfile.cloudbuild', '.']
- name: "gcr.io/cloud-builders/docker"
  id: Push image
  args: ["push", "${_CONTAINER_IMAGE_NAME}"]
- name: "gcr.io/cloud-builders/gke-deploy"
  id: Deploy image
  args:
  - run
  - --filename=openphish/deployment-prod.yaml
  - --image=${_CONTAINER_IMAGE_NAME}
  - --location=us-east4
  - --project=nyc3-prod-intel
  - --cluster=nyc3-prod-opencti-odin-connectors
substitutions:
  _CONTAINER_IMAGE_NAME: 'gcr.io/nyc3-dev-phoenix/github.com/nyc-cyber-command/nyc3-cta-opencti-connectors/prod-openphish:openphish_prod'
images:
- '${_CONTAINER_IMAGE_NAME}'
options:
  machineType: 'E2_HIGHCPU_32'
