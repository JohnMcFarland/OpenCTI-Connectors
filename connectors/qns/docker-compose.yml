# QNS OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  qns:
    build: .
    container_name: opencti-connector-qns
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=QNS
      - CONNECTOR_SCOPE=qns
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service ---
      - RENDER_SERVICE_URL=http://pdf-renderer:8080/render
      - RENDER_TIMEOUT=120
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - QNS_BASE_URL=https://qns.com
      - QNS_PER_PAGE=100
      - QNS_POLL_INTERVAL=86400          # seconds between enumeration runs (24h)
      - QNS_REQUEST_DELAY=2              # seconds between renders; no crawl-delay in robots.txt
      - QNS_MAX_REPORTS=0                # 0 = unlimited; set to 3 for a bounded test run
      - QNS_RENDER_RETRIES=3
      - QNS_CONFIDENCE=50                # OpenCTI confidence 0-100 (Medium band)
      - QNS_REPORT_TYPE=open-source-reporting
      - QNS_TLP=TLP:CLEAR
      - QNS_AUTHOR_NAME=QNS
    restart: always
