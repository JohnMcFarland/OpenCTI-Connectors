# Kaspersky ICS CERT OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  kaspersky-ics-cert:
    build: .
    container_name: opencti-connector-kaspersky-ics-cert
    volumes:
      # Shared microservices/ package (pdf-renderer client and Crucible
      # classifier), read-only, at /microservices. Required.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=Kaspersky ICS CERT
      - CONNECTOR_SCOPE=kaspersky_ics_cert
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service (house client in microservices/make_pdf.py) ---
      - PDF_RENDERER_URL=http://pdf-renderer:8000
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - KASPERSKY_ICS_CERT_FEED_URL=https://ics-cert.kaspersky.com/feed/
      - KASPERSKY_ICS_CERT_POLL_INTERVAL=3600
      - KASPERSKY_ICS_CERT_REQUEST_DELAY=3
      - KASPERSKY_ICS_CERT_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - KASPERSKY_ICS_CERT_MAX_AGE_DAYS=30            # skip items older than this (0 = no limit)
      - KASPERSKY_ICS_CERT_RENDER_RETRIES=3
      - KASPERSKY_ICS_CERT_PDF_RENDER_TIMEOUT=120
      - KASPERSKY_ICS_CERT_CONFIDENCE=50
      - KASPERSKY_ICS_CERT_REPORT_TYPE=open-source-reporting
      - KASPERSKY_ICS_CERT_TLP=TLP:CLEAR
      - KASPERSKY_ICS_CERT_AUTHOR_NAME=Kaspersky ICS CERT
    restart: always
