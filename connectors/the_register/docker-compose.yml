# The Register OpenCTI connector - GitHub template compose file.
# Contains NO credentials, tokens, UUIDs, or instance-specific values.
# The local docker-compose.override.yml supplies real values and is never
# committed.
version: '3'
services:
  the-register:
    build: .
    container_name: opencti-connector-the-register
    volumes:
      # Shared Crucible classifier helper, read-only, at /microservices.
      - ../microservices:/microservices:ro
    environment:
      # --- OpenCTI platform connection ---
      - OPENCTI_URL=
      - OPENCTI_TOKEN=
      # --- Connector identity ---
      - CONNECTOR_ID=            # generate once: uuidgen
      - CONNECTOR_TYPE=EXTERNAL_IMPORT
      - CONNECTOR_NAME=The Register
      - CONNECTOR_SCOPE=the_register
      - CONNECTOR_LOG_LEVEL=info
      # --- PDF render service ---
      - RENDER_SERVICE_URL=http://pdf-renderer:8080/render
      - RENDER_TIMEOUT=120
      # --- Report type (Crucible Collector /classify) ---
      # Set the URL in docker-compose.override.yml. Blank = standalone: no
      # call is made and every Report gets the default report_type.
      - CRUCIBLE_COLLECTOR_URL=
      - CRUCIBLE_CLASSIFY_TIMEOUT=30    # seconds per /classify call
      # --- Source / behaviour (non-sensitive; defaults shown) ---
      - THE_REGISTER_FEED_URL=https://www.theregister.com/headlines.atom
      - THE_REGISTER_POLL_INTERVAL=1800
      - THE_REGISTER_REQUEST_DELAY=3
      - THE_REGISTER_MAX_REPORTS=0           # 0 = unlimited; 3 for a bounded test
      - THE_REGISTER_RENDER_RETRIES=3
      - THE_REGISTER_CONFIDENCE=50
      - THE_REGISTER_REPORT_TYPE=open-source-reporting
      - THE_REGISTER_TLP=TLP:CLEAR
      - THE_REGISTER_AUTHOR_NAME=The Register
    restart: always
